server {
    listen       443 ssl;
    server_name  mycf.wl4g.com;
    ssl_certificate cert.d/wl4g.fullchain.letencrypt.pem;
    ssl_certificate_key cert.d/wl4g.letencrypt.pem;
    #ssl_certificate cert.d/wl4g.com.cloudflare.pem;
    #ssl_certificate_key cert.d/wl4g.com.cloudflare.key.pem;
    ssl_session_timeout 5m;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_prefer_server_ciphers on;
    include /etc/nginx/default.d/*.conf;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    client_max_body_size 50m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;

    location = /ws {
      proxy_pass http://127.0.0.1:8787/ws;
    }

    location / {
      root /usr/share/nginx/html/mycf/;
    }
}
